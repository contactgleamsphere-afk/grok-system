name: ci
# D-119: off-laptop regression gate on the free GitHub Actions tier (same account, no new signup).
on:
  push:
    branches: [main, "proposal/**"]
    paths: ["core/**", "tools/**", "config/**", ".github/workflows/ci.yml"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q pytest
      - run: python -m pytest core/tests -q
